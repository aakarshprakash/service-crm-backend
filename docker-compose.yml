# Production-style stack for the API only. Put a TLS-terminating proxy (Caddy, Traefik
# or a cloud load balancer) in front of port 8080 — session cookies are Secure-only.
# The frontend is deployed separately (Cloudflare Pages) at FRONTEND_URL.
#
#   cp .env.production.example .env.production   # fill in secrets
#   docker compose --env-file .env.production up -d --build
services:
  app:
    build: .
    image: service-crm-api:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    volumes:
      - storage:/var/www/app/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-service_crm}
      MYSQL_USER: ${DB_USERNAME:-crm}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redis:/data

volumes:
  mysql:
  redis:
  storage:
