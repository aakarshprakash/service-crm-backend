server {
    listen 8080 default_server;
    server_name _;
    root /var/www/app/public;

    server_tokens off;
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain application/json;

    # API, Sanctum CSRF endpoint, health check, OpenAPI docs (super admins only).
    # Security headers are set by the SecurityHeaders middleware, not here.
    location ~ ^/(api|sanctum|up|docs/api)(/|\.json|$) {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location / {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
